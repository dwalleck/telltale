name: Build and test

# The only automated check on this repository. Windows is in the matrix because the tool is deployed there and
# a CRLF checkout has broken tests that passed on macOS.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "build-and-test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Build and test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the .NET SDK that global.json pins
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Warnings are errors (Directory.Build.props), so a new warning fails here.
      - name: Build
        run: dotnet build

      # The embedded SQL scripts must be the same bytes on every machine: their text identifies the derived
      # objects. On Windows this also proves that .gitattributes keeps a checkout from converting them.
      - name: Check the line endings of the SQL scripts
        shell: pwsh
        run: ./eng/check-sql-line-endings.ps1 -RepoRoot .

      # Tests run against a fake Jira: no network, no secrets. The limit of four tests at once is for a
      # developer's machine; the Windows runner finishes sooner with no limit (11m 25s against 13m 20s with it).
      - name: Test
        run: dotnet test --no-build
        env:
          TELLTALE_TEST_PARALLELISM: "0"
